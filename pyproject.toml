[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photoacoustic-fem-forward"
version = "0.1.0"
description = "Independent 2-D photoacoustic pressure FEM forward model"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "photoacoustic-fem-forward contributors"}]
keywords = ["photoacoustic", "finite-element-method", "acoustics", "gmsh", "scikit-fem"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
  "numpy==2.4.6; python_version < '3.12'",
  "numpy==2.5.3; python_version >= '3.12'",
  "scipy==1.18.1",
  "meshio==5.3.5",
  "scikit-fem==12.0.2",
  "gmsh==4.15.2",
  "matplotlib==3.11.1",
  "pillow==12.3.0"
]

[project.optional-dependencies]
test = ["pytest>=8.0,<10"]

[project.scripts]
pa-fem = "pa_fem.cli:main"

[project.urls]
Homepage = "https://github.com/341151719/photoacoustic-fem-forward"
Repository = "https://github.com/341151719/photoacoustic-fem-forward"
Issues = "https://github.com/341151719/photoacoustic-fem-forward/issues"

[tool.setuptools.packages.find]
include = ["pa_fem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
